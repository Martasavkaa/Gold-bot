name: Gold price Poland

on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send gold price to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request

          NBP_URL = "https://api.nbp.pl/api/cenyzlota/last/30/?format=json"
          NBP_USD_URL = "https://api.nbp.pl/api/exchangerates/rates/a/usd/?format=json"
          OZ = 31.1034768

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "gold-price-pl/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def build():
              data = get(NBP_URL)
              last = data[-1]
              prev = data[-2] if len(data) > 1 else None
              price = last["cena"]
              lines = [
                  f"🥇 Ціна золота (NBP) на {last['data']}",
                  f"1 г: {price:.2f} PLN",
                  f"1 унція: {price * OZ:,.0f} PLN".replace(",", " "),
              ]
              if prev:
                  diff = price - prev["cena"]
                  pct = diff / prev["cena"] * 100
                  arrow = "📈" if diff > 0 else "📉" if diff < 0 else "➖"
                  lines.append(f"{arrow} Зміна до {prev['data']}: {diff:+.2f} PLN ({pct:+.2f}%)")
              month = data[-22:]
              lines.append(
                  f"За ~місяць: мін {min(d['cena'] for d in month):.2f} / "
                  f"макс {max(d['cena'] for d in month):.2f} PLN"
              )
              try:
                  usd = get(NBP_USD_URL)["rates"][0]["mid"]
                  lines.append(f"≈ {price / usd:.2f} USD за 1 г")
              except Exception:
                  pass
              lines.append("ℹ️ Індикативна ціна NBP; у ювелірів і мінцях ціна вища.")
              return "\n".join(lines)

          try:
              text = build()
          except Exception as e:
              text = f"⚠️ Не вдалося отримати ціну золота: {e}"

          print(text)
          token = os.environ["TELEGRAM_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          body = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
          urllib.request.urlopen(url, data=body, timeout=20)
          print("Надіслано")
          EOF
