#!/usr/bin/env python3
"""
Щоденне сповіщення про ціну золота в Польщі.

Джерело: офіційний API Національного банку Польщі (NBP) —
ціна 1 г золота (проба 1000) у PLN. Публікується в робочі дні близько 15:00.

Налаштування Telegram (необов'язково) через змінні середовища:
    TELEGRAM_TOKEN   — токен бота від @BotFather
    TELEGRAM_CHAT_ID — ваш chat id
Без них скрипт просто виводить повідомлення в консоль.
"""

import json
import os
import urllib.parse
import urllib.request

NBP_URL = "https://api.nbp.pl/api/cenyzlota/last/30/?format=json"
NBP_USD_URL = "https://api.nbp.pl/api/exchangerates/rates/a/usd/?format=json"
TROY_OUNCE_G = 31.1034768


def fetch_json(url: str):
    req = urllib.request.Request(url, headers={"User-Agent": "gold-price-pl/1.0"})
    with urllib.request.urlopen(req, timeout=20) as resp:
        return json.load(resp)


def build_message() -> str:
    data = fetch_json(NBP_URL)  # від старіших до новіших
    last = data[-1]
    prev = data[-2] if len(data) > 1 else None

    price = last["cena"]
    lines = [
        f"🥇 Ціна золота (NBP) на {last['data']}",
        f"1 г: {price:.2f} PLN",
        f"1 унція: {price * TROY_OUNCE_G:,.0f} PLN".replace(",", " "),
    ]

    if prev:
        diff = price - prev["cena"]
        pct = diff / prev["cena"] * 100
        arrow = "📈" if diff > 0 else "📉" if diff < 0 else "➖"
        lines.append(f"{arrow} Зміна до {prev['data']}: {diff:+.2f} PLN ({pct:+.2f}%)")

    month = data[-22:] if len(data) >= 22 else data
    lines.append(
        f"За ~місяць: мін {min(d['cena'] for d in month):.2f} / "
        f"макс {max(d['cena'] for d in month):.2f} PLN"
    )

    try:
        usd = fetch_json(NBP_USD_URL)["rates"][0]["mid"]
        lines.append(f"≈ {price / usd:.2f} USD за 1 г (курс NBP {usd:.4f})")
    except Exception:
        pass  # курс USD — додаткова інформація, не критично

    lines.append("ℹ️ Це індикативна ціна NBP; у ювелірів і мінцях ціна відрізняється.")
    return "\n".join(lines)


def send_telegram(text: str) -> bool:
    token = os.environ.get("TELEGRAM_TOKEN")
    chat_id = os.environ.get("TELEGRAM_CHAT_ID")
    if not token or not chat_id:
        return False
    url = f"https://api.telegram.org/bot{token}/sendMessage"
    payload = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
    with urllib.request.urlopen(url, data=payload, timeout=20) as resp:
        return resp.status == 200


def main():
    try:
        message = build_message()
    except Exception as e:
        message = f"⚠️ Не вдалося отримати ціну золота: {e}"

    print(message)
    try:
        if send_telegram(message):
            print("\n✅ Надіслано в Telegram")
    except Exception as e:
        print(f"\n⚠️ Помилка Telegram: {e}")


if __name__ == "__main__":
    main()
